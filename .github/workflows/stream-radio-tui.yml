name: stream-radio-tui

on:
  push:
    branches: [main]
    paths:
      - 'apps/stream-radio-tui/**'
      - 'plugins/stream-radio/core/**'
      - '.github/workflows/stream-radio-tui.yml'
  pull_request:
    paths:
      - 'apps/stream-radio-tui/**'
      - 'plugins/stream-radio/core/**'
      - '.github/workflows/stream-radio-tui.yml'
  workflow_dispatch:

# Read-only by default: the tests and the build run with a token that can't
# write. Only the publish job, on main, can.
permissions:
  contents: read

# Two pushes to main in a row must not race over the tag, so main's runs queue;
# a new push to a pull request cancels that pull request's stale run.
concurrency:
  group: stream-radio-tui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Named release: the branch protection on main requires a check of that name.
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/stream-radio-tui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/stream-radio-tui/package-lock.json

      - run: npm ci

      # The core's own tests run under `claude plugin test`, which needs Claude
      # Code and is not available here. The TUI's suite drives the real core,
      # and tsc type-checks the core files the TUI imports.
      - run: npx tsc --noEmit
      - run: npx vitest run

      # build.mjs shortens GITHUB_SHA to 7 characters for `--version`.
      - run: npm run build

      - name: Smoke check
        run: node dist/stream-radio-tui.mjs --version

      # The installer checks the download against this.
      - name: Checksum
        working-directory: apps/stream-radio-tui/dist
        run: sha256sum stream-radio-tui.mjs > stream-radio-tui.mjs.sha256

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: stream-radio-tui
          path: |
            apps/stream-radio-tui/dist/stream-radio-tui.mjs
            apps/stream-radio-tui/dist/stream-radio-tui.mjs.sha256
          if-no-files-found: error
          retention-days: 1

  # Only main moves the rolling tag. This job runs no npm and no build: it
  # publishes what the release job built, with the only token that can write.
  # The tag moves to each build, so the release must not be immutable: an
  # immutable release locks its tag, and GitHub never frees the name again
  # (stream-radio-tui-latest was lost that way). Keep the repository's
  # release immutability off.
  publish:
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: stream-radio-tui
          path: dist

      # The files go up under staged names first, then each old file is
      # deleted and its new one renamed into place straight after, so an
      # install finds either file missing for an API call at most (the
      # installer tries again). The tag moves last: the releases page shows
      # the new commit only once its files are in place.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TAG: stream-radio-tui-rolling
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/stream-radio-tui/package.json').version")
          notes="version $version, commit $SHA"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --prerelease --target "$SHA" \
              --title "stream-radio TUI (latest build)" --notes "$notes"
          assets="repos/$GITHUB_REPOSITORY/releases/assets"
          id_of() {
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq ".assets[] | select(.name == \"$1\") | .id"
          }
          names="stream-radio-tui.mjs stream-radio-tui.mjs.sha256"

          # staged files a run that failed midway left behind
          for name in $names; do
            id=$(id_of "next-$name")
            if [ -n "$id" ]; then gh api -X DELETE "$assets/$id"; fi
          done
          mkdir staged
          for name in $names; do cp "dist/$name" "staged/next-$name"; done
          gh release upload "$TAG" staged/next-stream-radio-tui.mjs staged/next-stream-radio-tui.mjs.sha256

          # every id looked up before the first delete, so the swaps run back to back
          declare -A old new
          for name in $names; do
            old[$name]=$(id_of "$name")
            new[$name]=$(id_of "next-$name")
            if [ -z "${new[$name]}" ]; then echo "next-$name did not upload" >&2; exit 1; fi
          done
          for name in $names; do
            if [ -n "${old[$name]}" ]; then gh api -X DELETE "$assets/${old[$name]}"; fi
            gh api -X PATCH "$assets/${new[$name]}" -f name="$name" >/dev/null
          done

          git tag -f "$TAG" "$SHA"
          git push -f origin "refs/tags/$TAG"
          gh release edit "$TAG" --notes "$notes"
